[project]
name = "ptflow"
version = "0.1.0"
description = "Prefect scaffolding for automated pentest pipelines — files on disk are the only state."
requires-python = ">=3.11"
dependencies = [
    "prefect>=3.0",
    "fastapi<0.137",  # Prefect 3.7.x ephemeral server crashes with FastAPI 0.137+ (del router.routes)
]

[project.scripts]
ptflow = "ptflow.cli:main"

[project.optional-dependencies]
ai = [
    "openai>=2.44.0",
]
ai-browser = [
    "playwright>=1.50.0",
]
ai-all = [
    "openai>=2.44.0",
    "playwright>=1.50.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["ruff", "ty"]
test = ["pytest", "pytest-cov"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001", "S603", "S607", "TC001", "TC003", "ERA001", "ANN401", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "INP001", "PLR2004", "PLC0415", "SLF001"]

[tool.ty.environment]
python-version = "3.11"
