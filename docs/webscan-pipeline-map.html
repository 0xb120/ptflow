const graph = "flowchart TD\nscope([\"scope.txt\"])\nsubgraph BREADTH[\"\u2460 BREADTH \u00b7 activity scope \u2014 una volta su tutto lo scope\"]\ndirection TB\nprovision_wl[\"<b>provision_wl</b><br/><span class='r'>net=False</span><br/><code># wordlists.provision() \u2014 un symlink wl_global/&lt;role&gt;.txt per ruolo risolto</code>\"]\ningest[\"<b>ingest</b><br/><code>httpx -nfs -sc -cl -td -title -ip -hash sha256 -favicon -location -fr -irh -j<br/># -nfs (no-fallback-scheme): rispetta http/https + porta ESPLICITI di ogni target</code>\"]\nend\nscope -.->|\u2225 offline| provision_wl\nprovision_wl --> ingest\nCLUSTER{{\"\u2461 CLUSTER \u00b7 pivot fan-out<br/>\u2192 scans/&lt;app_id&gt;/\"}}\nBREADTH ==> CLUSTER\nscreenshot[\"<b>screenshot</b><br/><code>httpx -ss -system-chrome -no-screenshot-full-page -st 20 -srd &lt;screenshots&gt; -svrc<br/>      -sc -cl -title -td -server -ip -favicon -location -irh -j   # fingerprint (-j)<br/>eyewitness --web -f &lt;1 url/gruppo&gt; -d &lt;out&gt; --no-prompt --timeout 15   # opzionale</code>\"]\nCLUSTER -.->|\u2225 loop| screenshot\nsubgraph P1[\"\u2462 PER-APP \u00b7 FASE 1 \u00b7 surface recon\"]\ndirection TB\ncrawl[\"<b>crawl</b><br/><code>katana -j -jc -jsl -kf all -fx -xhr -pc -fs fqdn -d 3 -c 2 -omit-body -srd responses/ [-H auth]<br/>crawley -headless -depth 3 -workers 15 -all -js -robots crawl   # per host<br/># classify: &lt;a href&gt; raw + crawley vs fx-parsato (+ thin-shell) \u2192 crawl_class.json<br/># parse_katana_requests \u2192 requests_crawl.jsonl (method/body/form/xhr, non solo URL)</code>\"]\ncrawl_headless[\"<b>crawl_headless</b><br/><code>katana -hl -nos -jc -jsl -xhr -fx -iqp -fs fqdn -d 3 -c 5 -ct 180 -rl 50 -srd responses/headless/ [-H auth]<br/># parse_katana_requests \u2192 requests_headless.jsonl (XHR/fetch POST/JSON della SPA)</code>\"]\napi_spec[\"<b>api_spec</b><br/><code>httpx -srd store/ -mc 200   # sonda ~10 path spec noti (/openapi.json, /swagger.json, /v3/api-docs\u2026)<br/># expand_openapi: ogni operazione (path x metodo) \u2192 richiesta (path-param '1', query/header,<br/>#   requestBody/in:body \u2192 skeleton JSON|urlencoded), cap API_SPEC_MAX_OPS=300<br/>httpx -mc 200,400,405      # endpoint GraphQL \u2192 richiesta POST-json ({query:{__typename}})</code>\"]\nmine_responses[\"<b>mine_responses</b><br/><span class='r'>net=False</span><br/><code>jsluice urls &lt;js dello store + sorgenti da sourcemap&gt;   # \u2192 endpoints_js.txt<br/># _reconstruct_sourcemaps: .map (fetchati) + data: inline \u2192 raw/extracted/sourcemap/*.js<br/># parse_sourcemap: sourcesContent \u2192 sorgenti de-bundlati (endpoint + secret fleet li vedono)</code>\"]\nrequest_catalog[\"<b>request_catalog</b><br/><span class='r'>net=False</span><br/><code># 1) record richiesta: requests_crawl + requests_headless + requests_api<br/># 2) SHAPE minati offline dal corpus crawl (fetch once \u2014 i body sono gi\u00e0 su disco):<br/>#    jsluice_requests(JS) \u2192 metodo/contentType/bodyParams di fetch/XHR \u00b7 html_form_requests(HTML)<br/>#    \u2192 form POST/GET; url relative risolte sull'URL sorgente del body (stem\u2192url dagli index -srd)<br/># 3) endpoint URL-only come GET di fallback \u00b7 scheme raggiungibile (_working_schemes) \u00b7 in-scope<br/># dedup per shape (request_key = metodo + path-template) \u2192 merge_requests<br/># 4) DROP delle shape GET il cui path il corpus ha visto SOLO come 404/410 (dead_url_keys)</code>\"]\nend\ncrawl --> crawl_headless\ncrawl_headless --> mine_responses\ncrawl_headless --> request_catalog\nmine_responses --> request_catalog\napi_spec --> request_catalog\nCLUSTER ==> P1\nBAR2[[\"\u2501\u2501 BARRIERA: FASE 1 \u2192 FASE 2 \u2501\u2501\"]]\nP1 ==> BAR2\nsubgraph P2[\"FASE 2 \u00b7 DAST surface\"]\ndirection TB\ndast[\"<b>dast</b><br/><code># input: requests.jsonl (parametri osservati), dedup per shape, cap DAST_MAX_REQUESTS=1500<br/>#   \u2192 raw/dast/input.jsonl ({request:{endpoint,raw}})<br/>nuclei -dast -im jsonl -l input.jsonl -t &lt;dast templates&gt; -fa low -rl &lt;profilo&gt; -c &lt;profilo&gt;<br/>       -timeout 10 -retries 2 -j -silent -duc [-H auth]<br/># dedup_dast_findings: 1 record per (template, host, path, fuzz position) \u2014 collassa i re-fire<br/>#   dello stesso punto di iniezione (varianti sintetizzate, http+https) su UN solo finding</code>\"]\nxss[\"<b>xss</b><br/><code># candidati = request parametrizzati del catalogo superficie (cap VULN_MAX_REQUESTS=40)<br/>dalfox file &lt;raw&gt; --rawdata --format jsonl --skip-bav -w 30 --timeout 10 [--http] [-H auth]<br/># 1 processo per request (raw Burp/ZAP) \u2192 testa query/body/json/header, non solo GET<br/># PTFLOW_OAST=on: interactsh-client per il pass + -b https://b&lt;i&gt;.&lt;domain&gt; (callback per-request)<br/>#   \u2192 correlate_oast: full-id &lt;marker&gt;.&lt;uid&gt; \u2192 request \u2192 finding poc_kind:blind (solo sincroni)</code>\"]\nsqli[\"<b>sqli</b><br/><code># candidati = request parametrizzati del catalogo superficie (cap VULN_MAX_REQUESTS=40)<br/>sqlmap -r &lt;raw&gt; --batch --smart --level 1 --risk 1 --threads 4 --disable-coloring [-H auth]<br/># 1 processo per request \u00b7 --smart = test pesanti solo su euristica positiva (politeness)</code>\"]\ncve_lookup[\"<b>cve_lookup</b><br/><span class='r'>net=False</span><br/><code># software = collect_software(tech, Server header, banner nerva, lib del corpus) \u2014 solo con versione<br/>search_vulns -q '&lt;Prodotto Versione&gt;' -f json --ignore-general-product-vulns --use-created-product-ids<br/># --use-created-product-ids: product ID alla versione ESATTA (no ladder) \u00b7 cache memo process-wide \u00b7 offline DB locale</code>\"]\nend\nBAR2 ==> P2\nBAR3[[\"\u2501\u2501 BARRIERA: FASE 2 \u2192 FASE 3 \u2501\u2501\"]]\nP2 ==> BAR3\nsubgraph P3[\"FASE 3 \u00b7 fuzzing/guessing\"]\ndirection TB\nwordlist[\"<b>wordlist</b><br/><span class='r'>net=False</span><br/><code>tokenize_urls(endpoints + headless + js)            # \u2192 seed.txt<br/>extract_param_names(query keys + jsluice q/bodyParams + form name= + JSON keys)  # \u2192 params.txt<br/>extract_value_words(query values + app-name + tech/header + apex)                # \u2192 values.txt<br/>extract_identities(email regex + mailto + local-part + campi user/owner/\u2026)       # \u2192 identities.txt</code>\"]\ntech_enum[\"<b>tech_enum</b><br/><code>shortutil wordlist &lt;seed + global content&gt; &gt; rainbow.txt<br/>shortscan -o json -a auto -w rainbow.txt -c 20 @hosts</code>\"]\ncontent_discovery[\"<b>content_discovery</b><br/><code># Pass A round 0 (wordlist STAGED: build_content_wordlist):<br/>feroxbuster --smart -k -t 5 -L 2 -d 2 --timeout 15 --time-limit 20m -w round0.txt [-x exts]<br/># feedback round (fuzza SOLO i token NUOVI):<br/>feroxbuster --smart \u2026 --time-limit 5m -w round&lt;r&gt;.txt<br/>httpx -srd responses/discovered/round&lt;r&gt;/ -rl 50   # scarica i nuovi hit 2xx/3xx<br/>jsluice urls &lt;new-js&gt;                              # mina \u2192 cresce la frontiera<br/># stage 3 deep dive (OPT-IN PTFLOW_DEEP_DIVE, solo host high-value):<br/>feroxbuster --smart \u2026 -d 3 --time-limit 30m -w deepdive&lt;i&gt;.txt   # mn_php/mn_phpmillion/mn_html<br/># poi UNA volta sul corpus completo, secret fleet \u2225:<br/>jsluice secrets \u2225 gitleaks \u2225 trufflehog --results=verified \u2225 detect-secrets</code>\"]\nrecrawl[\"<b>recrawl</b><br/><code># select_recrawl_seeds: hit 2xx il cui PRIMO SEGMENTO di path nessun URL crawlato usa<br/>#   (covered = (host, primo-segmento) di endpoints.txt+headless+store) \u2192 1 seed shallow/segmento nuovo<br/># PTFLOW_RECRAWL: off | preview (scrive raw/recrawl/seeds.txt, NON crawla) | on (default: crawla)<br/>katana -jc -jsl -kf all -fx -xhr -fs fqdn -d 2 -c 2 -ct 120 -omit-body -srd responses/recrawl/ [-H auth]</code>\"]\ncloud_assets[\"<b>cloud_assets</b><br/><code># passive: parse_cloud_refs(corpus body + URL dello store) \u2192 bucket S3/GCS/Azure referenziati<br/># candidati: bucket_candidates(apex) \u2192 &lt;label&gt;{,-assets,-dev,-backups,\u2026} su S3 + GCS<br/>httpx -mr 'ListBucketResult|EnumerationResults|&lt;Contents&gt;|storage#objects'   # \u2192 public (high)<br/>httpx -mc 403   # \u2192 exists-but-private (info) \u00b7 memoizzato per URL bucket process-wide</code>\"]\nend\nwordlist --> tech_enum\nwordlist --> content_discovery\ntech_enum --> content_discovery\ncontent_discovery --> recrawl\nBAR3 ==> P3\nBAR4[[\"\u2501\u2501 BARRIERA: FASE 3 \u2192 FASE 4 \u2501\u2501\"]]\nP3 ==> BAR4\nsubgraph P4[\"FASE 4 \u00b7 DAST deep\"]\ndirection TB\nrequest_catalog_full[\"<b>request_catalog_full</b><br/><span class='r'>net=False</span><br/><code># _assemble_catalog(include_guessed=True): requests_crawl/headless/api + requests_recrawl<br/>#   + shape minati dal corpus completo + endpoint URL-only (incl. content_discovery 2xx) come GET<br/># dedup per shape (request_key = metodo + path-template) \u2192 merge_requests \u00b7 scheme raggiungibile \u00b7 in-scope<br/># DROP delle shape GET dead/404 (dead_url_keys, sul corpus ora esteso da content_discovery/recrawl)</code>\"]\nparam_fuzz[\"<b>param_fuzz</b><br/><code># query: ogni shape (dedup path-template, cap 50) \u00b7 body+json: endpoint con body (form/xhr/POST,<br/>#   cap 25, + probe sui GET) \u00b7 header: subset (cap 15, solo x8). wordlist params custom-first.<br/>arjun -i targets_&lt;loc&gt;.txt -oJ &lt;loc&gt;.json -m GET|POST|JSON -t 5 -T 15 --rate-limit 20 -q [--headers auth]<br/>x8 -u targets_&lt;loc&gt;.txt -w params -O json -o &lt;loc&gt;.json [-X POST] [-t json] [--headers] [-H auth]<br/># matrice (tool, location) in un pool cappato (PARAM_FANOUT=3); cap wall-clock per-tool 600s<br/># collapse_global_params: un param trovato su \u226575% degli endpoint testati (\u22655) = riflesso<br/>#   SITE-WIDE \u2192 1 record host-level {scope:site-wide}, non sprayato su ogni endpoint</code>\"]\ndast_full[\"<b>dast_full</b><br/><code># delta = shape in requests_full.jsonl NON gi\u00e0 in requests.jsonl (request_key) + build_fuzz_requests(params)<br/>#   dedup per shape, cap DAST_MAX_REQUESTS=1500 \u2192 raw/dast/input_full.jsonl ({request:{endpoint,raw}})<br/>nuclei -dast -im jsonl -l input_full.jsonl -t &lt;dast templates&gt; -fa low -rl &lt;profilo&gt; -c &lt;profilo&gt;<br/>       -timeout 10 -retries 2 -j -silent -duc [-H auth]<br/># dedup_dast_findings: 1 record per (template, host, path, fuzz position), come in dast</code>\"]\nxss_full[\"<b>xss_full</b><br/><code># candidati = request parametrizzati del DELTA + build_fuzz_requests(params) (cap VULN_MAX_REQUESTS)<br/>dalfox file &lt;raw&gt; --rawdata --format jsonl --skip-bav -w 30 --timeout 10 [--http] [-H auth]</code>\"]\nsqli_full[\"<b>sqli_full</b><br/><code># candidati = request parametrizzati del DELTA + build_fuzz_requests(params) (cap VULN_MAX_REQUESTS)<br/>sqlmap -r &lt;raw&gt; --batch --smart --level 1 --risk 1 --threads 4 --disable-coloring [-H auth]</code>\"]\ncve_lookup_full[\"<b>cve_lookup_full</b><br/><span class='r'>net=False</span><br/><code># stessa correlazione offline di cve_lookup, sul corpus ora esteso<br/>search_vulns -q '&lt;Prodotto Versione&gt;' -f json --ignore-general-product-vulns<br/># delta = (prodotto,versione) NON in raw/cve/seen.txt \u00b7 cache memo condivisa con la passata FASE 2</code>\"]\ntech_vulnscan[\"<b>tech_vulnscan</b><br/><code># gate: meta.tech contiene 'wordpress' (match a parola intera) \u00b7 1 scan stealthy per host (-body-dedup)<br/>wpprobe scan -u &lt;host&gt; -o raw/wpprobe/scanN.json --rate-limit 20 -t 5 [-H &lt;auth&gt;]<br/># parse_wpprobe: un finding per (componente,versione,CVE) \u00b7 ordinati per severit\u00e0/CVSS</code>\"]\nend\nrequest_catalog_full --> param_fuzz\nrequest_catalog_full --> dast_full\nparam_fuzz --> dast_full\nrequest_catalog_full --> xss_full\nparam_fuzz --> xss_full\nrequest_catalog_full --> sqli_full\nparam_fuzz --> sqli_full\nBAR4 ==> P4\nFANIN[[\"\u2463 FAN-IN \u00b7 consolidate<br/>findings/&lt;tipo&gt;.jsonl\"]]\nP4 ==> FANIN\nscreenshot -.->|join| FANIN\nclassDef breadth fill:#0d2f54,stroke:#4f9be6,color:#dbe9fb;\nclassDef span fill:#2e2147,stroke:#a98ee0,color:#ece4fb;\nclassDef pivot fill:#073b42,stroke:#34d3e6,color:#d6fbff;\nclassDef bar fill:#3a424c,stroke:#8a96a3,color:#eef2f6,font-weight:bold;\nclassDef fanin fill:#10331c,stroke:#54d07a,color:#dcf6e3,font-weight:bold;\nclassDef phase1 fill:#10331c,stroke:#4cc46b,color:#dcf6e3;\nclassDef phase2 fill:#3a2f06,stroke:#e6c247,color:#f8edc2;\nclassDef phase3 fill:#3a0f23,stroke:#ef6a9b,color:#fbd9e6;\nclassDef phase4 fill:#3a1a08,stroke:#f08a4c,color:#fbe2d2;\nclass provision_wl,ingest breadth\nclass screenshot span\nclass crawl,crawl_headless,api_spec,mine_responses,request_catalog phase1\nclass dast,xss,sqli,cve_lookup phase2\nclass wordlist,tech_enum,content_discovery,recrawl,cloud_assets phase3\nclass request_catalog_full,param_fuzz,dast_full,xss_full,sqli_full,cve_lookup_full,tech_vulnscan phase4\nclass CLUSTER pivot\nclass BAR2,BAR3,BAR4 bar\nclass FANIN fanin";

mermaid.initialize({
  startOnLoad:false, securityLevel:'loose', theme:'dark',
  flowchart:{ htmlLabels:true, nodeSpacing:45, rankSpacing:60, curve:'basis' },
});

const diagram = document.getElementById('diagram');
const canvas = document.getElementById('canvas');
try {
  const { svg } = await mermaid.render('ptflowGraph', graph);
  diagram.innerHTML = svg;
} catch (e) {
  diagram.innerHTML = '<div class="loading">Errore nel rendering Mermaid: ' + e + '</div>';
}

let zoom = 1;
const apply = () => { diagram.style.transform = 'scale(' + zoom + ')'; };
const clamp = z => Math.min(12, Math.max(0.05, z));
const setZoom = z => { zoom = clamp(z); apply(); };

document.getElementById('zin').onclick = () => setZoom(zoom * 1.2);
document.getElementById('zout').onclick = () => setZoom(zoom / 1.2);
document.getElementById('zreset').onclick = () => setZoom(1);
document.getElementById('zfit').onclick = () => {
  const svg = diagram.querySelector('svg');
  if (!svg) return;
  const w = svg.getBoundingClientRect().width / zoom;
  setZoom((canvas.clientWidth - 90) / w);
};

canvas.addEventListener('wheel', (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const prev = zoom;
  setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
  const f = zoom / prev;
  canvas.scrollLeft = (canvas.scrollLeft + e.clientX) * f - e.clientX;
  canvas.scrollTop = (canvas.scrollTop + e.clientY) * f - e.clientY;
}, { passive:false });

let down = false, sx = 0, sy = 0, ox = 0, oy = 0;
canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  down = true; canvas.classList.add('grabbing');
  sx = e.clientX; sy = e.clientY; ox = canvas.scrollLeft; oy = canvas.scrollTop;
});
window.addEventListener('mousemove', (e) => {
  if (!down) return;
  canvas.scrollLeft = ox - (e.clientX - sx);
  canvas.scrollTop = oy - (e.clientY - sy);
});
window.addEventListener('mouseup', () => { down = false; canvas.classList.remove('grabbing'); });
</script>
