# Hosted Ollama setup. Create a key at https://ollama.com/settings/keys, then export it:
#   export OLLAMA_API_KEY=...
# Direct cloud API access needs no local `ollama serve` process.
# This engagement preset also selects the conservative home rate profile.

profile = "home"

[ai]
enabled = true
provider = "ollama-cloud"
model = "gpt-oss:120b"
base_url = "https://ollama.com/v1"
cache = true
concurrency = 2
timeout_seconds = 300
max_retries = 2
max_calls = 50
max_input_tokens = 250000
max_output_tokens = 30000
remote_secrets = "redacted"
