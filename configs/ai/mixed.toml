# Hybrid routing: sensitive classification stays local, synthesis uses hosted models.
# Export OPENROUTER_API_KEY and HF_TOKEN before the run.

[ai]
enabled = true
provider = "ollama"
model = "gpt-oss:20b"
base_url = "http://127.0.0.1:11434/v1"
cache = true
concurrency = 2
timeout_seconds = 180
max_retries = 2
max_calls = 50
max_input_tokens = 250000
max_output_tokens = 30000
max_cost = "5.00"
remote_secrets = "redacted"

[ai.stages.secret_triage]
provider = "ollama"
model = "gpt-oss:20b"
base_url = "http://127.0.0.1:11434/v1"
max_output_tokens = 4000

[ai.stages.wordlist]
provider = "huggingface"
model = "openai/gpt-oss-120b:fastest"
base_url = "https://router.huggingface.co/v1"
max_output_tokens = 2000

[ai.stages.triage]
provider = "openrouter"
model = "openai/gpt-oss-20b"
base_url = "https://openrouter.ai/api/v1"
max_output_tokens = 8000

[ai.stages.report]
provider = "openrouter"
model = "openai/gpt-oss-20b"
base_url = "https://openrouter.ai/api/v1"
max_output_tokens = 12000
