id: ptflow-lfi-passwd-body

info:
  name: Linux Local File Inclusion via Request Body Parameter
  author: ptflow
  severity: high
  description: Detects traversal to /etc/passwd from a body value using two structural response markers.
  metadata:
    max-request: 2
    verified: true
  tags: ptflow,dast,lfi,path-traversal,stable,fuzzing-req-body

http:
  -
    pre-condition:
      - type: dsl
        dsl:
          - 'method == "POST" || method == "PUT" || method == "PATCH" || method == "DELETE"'

    payloads:
      traversal:
        low:
          - '../../../../../../etc/passwd'
        medium:
          - '..%2f..%2f..%2f..%2f..%2f..%2fetc%2fpasswd'

    fuzzing:
      - part: body
        mode: single
        type: replace
        keys-regex:
          - '(?i)^(?:file|filename|filepath|path|page|include|template|document|folder|root|dir|download|load|x-file-path|x-path)$'
        fuzz:
          - '{{traversal}}'

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - '(?m)^root:[^:\r\n]*:0:0:'
      - type: word
        part: body
        words:
          - 'daemon:'
