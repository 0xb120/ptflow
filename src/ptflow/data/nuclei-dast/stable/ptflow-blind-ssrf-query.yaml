id: ptflow-blind-ssrf-query

info:
  name: Blind SSRF via Query Parameter
  author: ptflow
  severity: high
  description: Detects an HTTP callback controlled by a query value and correlated through Interactsh.
  metadata:
    max-request: 1
    verified: false
  tags: ptflow,dast,ssrf,oast,stable,fuzzing-req-query

http:
  -
    pre-condition:
      - type: dsl
        dsl:
          - 'method != "OPTIONS"'

    payloads:
      callback:
        - 'http://{{interactsh-url}}/ptflow-ssrf'

    fuzzing:
      - part: query
        mode: single
        type: replace
        keys-regex:
          - '(?i)^(?:url|uri|link|src|source|feed|host|domain|endpoint|callback|webhook|image|avatar|proxy|fetch|load|x-callback-url)$'
        fuzz:
          - '{{callback}}'

    stop-at-first-match: true
    matchers:
      - type: word
        part: interactsh_protocol
        words:
          - 'http'
